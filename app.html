  if(op.type==='move')return `<li>${esc(t.title)}: ${DAYS[t.day]} → <b>${DAYS[op.day]}</b></li>`;
  if(op.type==='lite')return `<li>${esc(t.title)}: làm <b>bản nhẹ</b> khoảng 20 phút</li>`;
  if(op.type==='postpone')return `<li>${esc(t.title)}: <b>tạm hoãn</b> sang tuần sau</li>`;
  return '';
}

function affectedTasks(){
  const und=active().filter(t=>!t.done);
  let a=und.filter(t=>t.day===TI||t.day===TI+1);
  if(!a.length){const up=und.filter(t=>t.day>TI).sort((x,y)=>x.day-y.day);if(up.length)a=[up[0]]}
  return a;
}
function moveOps(list){
  const cnt=Array(7).fill(0);active().forEach(t=>cnt[t.day]++);
  return list.map(t=>{
    let best=null;for(let d=Math.max(TI,t.day)+1;d<7;d++){if(best===null||cnt[d]<cnt[best])best=d}
    if(best===null)return{type:'postpone',id:t.id};
    cnt[best]++;cnt[t.day]--;return{type:'move',id:t.id,day:best};
  });
}
function ruleMessage(c,hasTasks){
  const out=[];
  if(c.status==='sick')out.push('Cảm ơn em đã cho Banipu biết. **Sức khoẻ của em quan trọng hơn kế hoạch** — hôm nay em ưu tiên nghỉ ngơi, uống đủ nước nhé. Nếu em sốt, đau nhiều hoặc mệt kéo dài, hãy báo thầy cô chủ nhiệm hoặc xuống phòng y tế trường.');
  else if(c.status==='tired')out.push('Cảm ơn em đã chia sẻ. Khi mệt, **làm ít mà đều** vẫn tốt hơn cố quá sức.');
  else out.push('Căng thẳng là cảm giác rất bình thường trước nhiều việc. Mình thử **chia nhỏ** việc học để nhẹ đầu hơn nhé. Nếu cảm giác này kéo dài, em có thể nói chuyện với thầy cô chủ nhiệm hoặc phòng tư vấn tâm lý học đường.');
  if(c.sleep==='lt5')out.push('Đêm qua em ngủ khá ít — tối nay thử đi ngủ sớm hơn 30 phút nhé.');
  out.push(hasTasks?'Banipu gợi ý vài cách điều chỉnh, em chọn cách hợp với mình:':'Hôm nay và ngày mai em không còn nhiệm vụ nào phải làm — cứ nghỉ ngơi thật tốt nhé.');
  return out.join('\n\n');
}
function ruleOptions(c){
  const a=affectedTasks(),opts=[];
  const lite={label:'Làm bản nhẹ',desc:'Giữ ngày cũ nhưng chỉ làm khoảng 20 phút, dừng khi thấy mệt',ops:a.map(t=>({type:'lite',id:t.id}))};
  const move={label:c.status==='sick'?'Nghỉ ngơi, dời nhiệm vụ':'Dời sang ngày khác',desc:'Chuyển sang ngày còn ít việc hơn trong tuần',ops:moveOps(a)};
  const moveOne={label:'Dời bớt một nhiệm vụ',desc:'Giảm tải hôm nay, phần còn lại làm nhẹ',ops:a.length>1?[...moveOps([a[0]]),...a.slice(1).map(t=>({type:'lite',id:t.id}))]:moveOps(a)};
  if(c.status==='sick')opts.push(move,{...lite,label:'Làm bản rất nhẹ',desc:'Chỉ 15–20 phút nếu em thấy đủ sức'});
  else if(c.status==='tired')opts.push(lite,move);
  else opts.push({...lite,label:'Chia nhỏ, làm bản nhẹ',desc:'Mỗi lần 20 phút, nghỉ 5 phút giữa các lần'},moveOne);
  const badDays=badOtherDays()+1;
  const und=active().filter(t=>!t.done).sort((x,y)=>x.day-y.day);
  if(badDays>=2&&und.length>=2)opts.push({label:'Giảm khối lượng tuần này',desc:`Tuần này em đã có ${badDays} ngày chưa ổn — tạm hoãn 1 nhiệm vụ sang tuần sau`,ops:[{type:'postpone',id:und[und.length-1].id}]});
  return opts.filter(o=>o.ops.length);
}
function validOps(ops){
  const und=new Set(active().filter(t=>!t.done).map(t=>t.id));
  return (Array.isArray(ops)?ops:[]).filter(o=>o&&und.has(Number(o.id))&&(o.type==='lite'||o.type==='postpone'||(o.type==='move'&&Number.isInteger(o.day)&&o.day>=TI&&o.day<=6)))
    .map(o=>({type:o.type,id:Number(o.id),day:o.day}));
}
async function buildAdjust(c){
  const hasTasks=affectedTasks().length>0||active().some(t=>!t.done);
  let message=null,options=null;
  if(sample&&hasTasks){
    try{
      const list=active().filter(t=>!t.done).map(t=>`- id ${t.id}: "${t.title}" (${DAYS[t.day]}, day=${t.day})${t.lite?' [đã là bản nhẹ]':''}`).join('\n');
      const r=await sample.json(`Bạn là Banipu – trợ lý học tập cho học sinh THPT nội trú, dựa trên Thuyết Tự quyết. Học sinh vừa check-in hôm nay (${DAYS[TI]}, day=${TI}; 0=thứ Hai … 6=Chủ nhật).
Trạng thái: ${CI[c.status].l}. Giấc ngủ đêm qua: ${SLEEP[c.sleep]||'không nói'}. Em kể thêm: "${c.note||'(không)'}".
Số ngày chưa ổn tuần này (kể cả hôm nay): ${badOtherDays()+1}.
Nhiệm vụ chưa xong trong tuần:
${list}
Hồ sơ của em: ${profileText()}

Viết "message": 2–4 câu ấm áp, gọi học sinh là "em", ghi nhận cảm xúc, KHÔNG chẩn đoán hay khuyên dùng thuốc. Nếu không khoẻ: nhắc nghỉ ngơi và báo thầy cô chủ nhiệm hoặc xuống phòng y tế trường nếu sốt, đau nhiều, mệt kéo dài. Nếu căng thẳng: gợi ý chia nhỏ việc và nhắc có thể nói chuyện với GVCN hoặc phòng tư vấn tâm lý học đường nếu kéo dài. Kết thúc bằng câu mời em chọn cách điều chỉnh.
Đề xuất 2–3 "options" khác nhau để điều chỉnh lịch phù hợp với sức khoẻ, ưu tiên các nhiệm vụ hôm nay và ngày mai. Mỗi option có label (dưới 6 từ), desc (dưới 16 từ), ops gồm các thao tác:
{"type":"move","id":số,"day":số ≥ ${TI}} chuyển ngày; {"type":"lite","id":số} làm bản nhẹ ~20 phút; {"type":"postpone","id":số} tạm hoãn sang tuần sau.
Không dời nhiệm vụ vào hôm nay khi em không khoẻ; tránh dồn nhiều việc vào một ngày.
Chỉ trả về JSON: {"message":string,"options":[{"label":string,"desc":string,"ops":[...]}]}`,{cache:false,modelTier:'default'});
      if(r&&typeof r.message==='string'&&r.message.trim())message=r.message.trim();
      if(r&&Array.isArray(r.options))options=r.options.slice(0,3).map(o=>({label:String(o.label||'Điều chỉnh'),desc:String(o.desc||''),ops:validOps(o.ops)})).filter(o=>o.ops.length);
    }catch(e){}
  }
  if(!options||!options.length)options=ruleOptions(c);
  if(!message)message=ruleMessage(c,options.length>0);
  if(c.status==='sick'&&!/y tế/i.test(message))message+='\n\nNếu em sốt, đau nhiều hoặc mệt kéo dài, hãy báo thầy cô chủ nhiệm hoặc xuống phòng y tế trường nhé.';
  return{message,options};
}
function applyOps(ops){
  ops.forEach(o=>{const t=taskById(o.id);if(!t)return;
    if(o.type==='move'){if(t.movedFrom==null)t.movedFrom=t.day;t.day=o.day}
    else if(o.type==='lite')t.lite=true;
    else if(o.type==='postpone')t.postponed=true;});
}

/* ---------------- Events ---------------- */
const A={
  ci(el){const v=el.dataset.v,r=el.getBoundingClientRect();S.checkins[ciKey()]=v==='ok'?{status:'ok',phase:'done'}:{status:v,phase:'form',sleep:'',note:''};render();
    if(v==='ok'){confetti(r.left+r.width/2,r.top+r.height/2,30);toast('Cảm ơn em đã check-in hôm nay!','😊')}},
  cisleep(el){const c=S.checkins[ciKey()];if(c){c.sleep=c.sleep===el.dataset.v?'':el.dataset.v;render()}},
  async ciadjust(){
    const c=S.checkins[ciKey()];if(!c)return;
    if(!S.current||!S.current.confirmed){c.message=ruleMessage(c,false)+'\n\nKhi đã khoẻ hơn, em có thể trò chuyện với Banipu để lập kế hoạch nhẹ nhàng cho tuần này.';c.phase='done';render();return}
    c.phase='loading';render();
    const r=await buildAdjust(c);c.message=r.message;c.options=r.options;c.sel=r.options.length?0:null;c.phase=r.options.length?'adjust':'done';render();
  },
  adjsel(el){const c=S.checkins[ciKey()];c.sel=Number(el.dataset.v);render()},
  adjkeep(){const c=S.checkins[ciKey()];c.phase='done';c.applied=null;render()},
  adjapply(){const c=S.checkins[ciKey()];const o=c.options[c.sel];if(!o)return;
    c.applied={label:o.label,before:JSON.stringify(S.current.tasks)};applyOps(o.ops);c.phase='done';render();toast('Đã áp dụng lịch mới cho em','🗓️')},
  adjundo(){const c=S.checkins[ciKey()];if(c&&c.applied){S.current.tasks=JSON.parse(c.applied.before);c.applied=null;c.phase=c.options&&c.options.length?'adjust':'done';render()}},
  ciredo(){const c=S.checkins[ciKey()];if(c&&c.applied)S.current.tasks=JSON.parse(c.applied.before);delete S.checkins[ciKey()];render()},
  role(el){S.role=el.dataset.v;window.scrollTo(0,0);render()},
  reset(){if(!resetArmed){resetArmed=true;render();setTimeout(()=>{resetArmed=false;render()},3000);return}
    resetArmed=false;S=defaultState();chatDraft='';busy=false;render()},
  tab(el){S.role='student';S.tab=el.dataset.v;window.scrollTo(0,0);S.editId=null;if(S.tab==='banipu'&&!S.chat.length)startChat();render();if(S.tab==='banipu')document.getElementById('chatIn')?.focus()},
  gochat(){S.tab='banipu';S.planView=false;if(!S.chat.length||S.stage>=4&&S.current&&S.current.confirmed&&!S.draft)startChat();render()},
  toggle(el){const t=S.current.tasks.find(x=>x.id==el.dataset.id);if(!t)return;
    const r=el.querySelector('.cb').getBoundingClientRect();t.done=!t.done;justId=t.done?t.id:null;render();
    if(t.done){
      const a=active();
      if(a.length&&a.every(x=>x.done)){bigConfetti();toast('Hoàn thành tất cả nhiệm vụ tuần này! Em làm tốt lắm','🏆')}
      else{confetti(r.left+r.width/2,r.top+r.height/2,26);toast(['Một bước nữa rồi, tốt lắm!','Giữ nhịp nhé, em đang làm rất tốt!','Thêm một nhiệm vụ xong!'][a.filter(x=>x.done).length%3],'✨')}
    }},
  theme(){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('banipu-theme',n)}catch(e){}
    const m=document.querySelector('meta[name=theme-color]');if(m)m.content=n==='dark'?'#050a17':'#eaf3ff';render()},
  iflog(el){const k=todayKey(),v=el.dataset.v==='1';if(S.ifLog[k]===v)delete S.ifLog[k];else S.ifLog[k]=v;render()},
  chip(el){send(el.dataset.v)},
  openplan(){if(S.draft){S.planView=true;S.editId=null;render()}},
  closeplan(){S.planView=false;S.editId=null;render()},
  load(el){S.draft.load=el.dataset.v;delete S.draft.count;S.editId=null;render()},
  edit(el){S.editId=Number(el.dataset.id);render();const i=document.getElementById('ed-title');if(i){i.focus();i.select()}},
  editcancel(){S.editId=null;render()},
  editsave(el){const t=S.draft.pool.find(x=>x.id==el.dataset.id);const ti=document.getElementById('ed-title').value.trim();
    if(t){if(ti)t.title=ti;t.day=Number(document.getElementById('ed-day').value);
      const tm=document.getElementById('ed-time')?.value;if(toMin(tm)!=null)t.time=tm;t.dur=Number(document.getElementById('ed-dur')?.value)||t.dur}S.editId=null;render()},
  slot(el){S.draft.pool.forEach(t=>{delete t.time});S.draft.slot=el.dataset.v;S.editId=null;render()},
  exportics(el){const src=el.dataset.src,it=planItems(src);if(!it.length)return;
    download(`Banipu-Tuan-${S.week}.ics`,buildICS(it,planWoop(src)),'text/calendar;charset=utf-8');confetti(innerWidth/2,innerHeight*.6,40);toast(`Đã tải lịch tuần ${S.week}. Mở file để thêm vào lịch của em`,'📅')},
  async copyplan(el){const src=el.dataset.src,txt=planText(planItems(src),planWoop(src));
    try{await navigator.clipboard.writeText(txt)}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()}
    toast('Đã sao chép lịch, em dán vào đâu cũng được','📋')},
  printplan(el){printSheet(el.dataset.src);const th=document.documentElement.dataset.theme;document.documentElement.dataset.theme='light';document.body.classList.add('pc');
    const done=()=>{document.body.classList.remove('pc');document.documentElement.dataset.theme=th;window.removeEventListener('afterprint',done)};
    window.addEventListener('afterprint',done);setTimeout(()=>window.print(),60)},
  restart(){startChat();S.tab='banipu';render()},
  confirm(){
    const d=S.draft,n=draftN(d),prev=S.current&&S.current.tasks||[];
    const tasks=d.pool.slice(0,n).map(t=>({id:t.id,title:t.title,day:t.day,time:t.time,dur:t.dur,done:!!prev.find(p=>p.title===t.title&&p.done)}));
    S.current={confirmed:true,load:d.load,slot:d.slot||'toi',woop:{...d.woop},tasks};
    S.draft=null;S.planView=false;S.chat=[];S.stage=0;S.tab='week';render();
    window.scrollTo(0,0);bigConfetti();toast(`Đã lưu kế hoạch tuần ${S.week}. Chúc em một tuần thật hiệu quả!`,'🎯');
  },
  rate(el){S.rdraft[el.dataset.k]=Number(el.dataset.v);render()},
  async submitreflect(){
    const r=S.rdraft;if(!r.selfRate||!r.mood)return;
    const done=active().filter(t=>t.done).length,total=active().length,wc=weekCheckins();
    const entry={week:S.week,done,total,selfRate:r.selfRate,mood:r.mood,good:r.good.trim(),hard:r.hard.trim(),ci:{ok:wc.filter(x=>x.status==='ok').length,bad:wc.filter(x=>x.status!=='ok').length}};
    S.reflected={entry,feedback:null};render();
    const fb=await getFeedback(entry);S.reflected.feedback=fb;render();
  },
  nextweek(){
    if(!S.reflected)return;
    S.history.push(S.reflected.entry);
    const st=ifStats();S.ifPrev=st;S.ifLog={};
    S.week++;S.current={confirmed:false,load:'vua',woop:S.current&&S.current.woop?S.current.woop:null,tasks:[]};
    S.reflected=null;S.rdraft={selfRate:0,mood:0,good:'',hard:''};
    S.chat=[];startChat();S.tab='banipu';render();
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  if(el.tagName==='INPUT'&&el.type==='checkbox')return;
  A[el.dataset.a]&&A[el.dataset.a](el);
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.a==='filter'){S.filter=e.target.checked;render()}});
document.addEventListener('input',e=>{
  const m=e.target.dataset&&e.target.dataset.m;
  if(m){S.rdraft[m]=e.target.value;save()}
  if(e.target.dataset&&e.target.dataset.ci==='note'){const c=S.checkins[ciKey()];if(c){c.note=e.target.value;save()}}
  if(e.target.id==='chatIn')chatDraft=e.target.value;
});
document.addEventListener('submit',e=>{if(e.target.id==='composer'){e.preventDefault();send(document.getElementById('chatIn').value)}});
document.addEventListener('keydown',e=>{if(e.target.id==='ed-title'&&e.key==='Enter'){e.preventDefault();document.querySelector('[data-a="editsave"]')?.click()}});

render();
</script>
