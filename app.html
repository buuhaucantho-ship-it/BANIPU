<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banipu · Kế hoạch học tuần của em</title>
<meta name="description" content="Bản chạy thử Banipu: lập kế hoạch học tuần cùng AI theo WOOP, check-in hằng ngày, tự đánh giá, theo dõi tiến bộ và bảng tín hiệu cho GVCN.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230297de'%3E%3Ccircle cx='6.5' cy='6.5' r='4.5'/%3E%3Ccircle cx='17.5' cy='6.5' r='4.5'/%3E%3Ccircle cx='6.5' cy='17.5' r='4.5'/%3E%3Crect x='13' y='13' width='9' height='9' rx='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5fafd;--surface:#fff;--ink:#0d2233;--muted:#46596a;--faint:#869aab;--line:#e1edf5;--line-2:#eef5fa;
  --brand:#0297de;--blue:#0279b5;--blue-dark:#026fa6;--blue-soft:#e6f5fc;--blue-mid:#8fd0ef;--blue-line:#c3e7f8;
  --pink:#d83995;--pink-ink:#b32377;--pink-soft:#fdedf6;--pink-line:#f5c3df;
  --warm:#fdedf6;--warm-ink:#b32377;--warm-line:#f5c3df;
  --grad:linear-gradient(135deg,#0279b5 0%,#02679a 100%);--grad-brand:linear-gradient(120deg,#0279b5 0%,#0297de 100%);--grad-bp:linear-gradient(90deg,#0297de,#d83995);
  --shadow:0 1px 2px rgb(2 60 100 / .04),0 14px 34px -24px rgb(2 60 100 / .28);
  --teal:#157a6e;--teal-soft:#e3f2ef;--teal-ink:#0f5f55;
  --r-s:10px;--r:14px;--r-l:18px;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);--hdr:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:400 15px/1.55 var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
input,textarea,select{font:inherit;color:inherit}
b,strong{font-weight:600}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--r-s);text-decoration:none}
.skip:focus{top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- site header ---------- */
.hdr{position:sticky;top:0;z-index:30;height:var(--hdr);display:flex;align-items:center;gap:16px;padding:0 24px;background:rgb(244 246 250 / .86);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:500;font-size:18px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.logo svg{width:20px;height:20px}
.hdr__sp{flex:1}
.hdr__pill{font-size:12.5px;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;white-space:nowrap}
.hdr__pill.ai{color:var(--teal-ink);background:var(--teal-soft);border-color:#bfe1da}
.hdr__link{font-size:14px;color:var(--muted);text-decoration:none;padding:8px 4px;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .25s var(--ease),color .2s}
.hdr__link:hover{color:var(--ink);background-size:100% 1px}
.linkbtn{white-space:nowrap;font-size:14px;color:var(--muted);padding:8px 4px;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .25s var(--ease),color .2s}
.linkbtn:hover{color:var(--ink);background-size:100% 1px}
.linkbtn.danger{color:#b4361a;background-size:100% 1px}
@media(max-width:720px){.hdr{padding:0 16px;gap:10px}.hdr__pill.lab,.hdr__link{display:none}}
@media(max-width:420px){.hdr__pill{display:none}}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:calc(100dvh - var(--hdr))}
.side{position:sticky;top:var(--hdr);height:calc(100dvh - var(--hdr));border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.side__lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px}
.side__lbl:first-child{padding-top:0}
.side__item{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:var(--r-s);color:var(--muted);font-weight:500;text-align:left;width:100%;transition:background .2s,color .2s}
.side__item svg{width:20px;height:20px;flex:none}
.side__item:hover{background:rgb(18 26 46 / .05);color:var(--ink)}
.side__item.on{background:var(--blue-soft);color:var(--blue)}
.side__item.on.t{background:var(--teal-soft);color:var(--teal-ink)}
.side__item em{margin-left:auto;font-style:normal;font-size:12px;font-weight:500;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.side__foot{margin-top:auto;padding:16px 12px 4px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.5}
.main{min-width:0}
.main__in{max-width:1120px;margin:0 auto;padding:40px 48px 72px}
.main.is-chat .main__in{max-width:800px;padding-bottom:0;min-height:calc(100dvh - var(--hdr));display:flex;flex-direction:column}
.main.is-narrow .main__in{max-width:760px}
.bnav{display:none}
@media(max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main__in{padding:24px 18px 104px}
  .main.is-chat .main__in{padding-bottom:76px;min-height:calc(100dvh - var(--hdr))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgb(255 255 255 / .94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;font-size:11.5px;color:var(--muted);font-weight:500;border-radius:var(--r-s)}
  .bnav button.on{color:var(--blue)}
  .bnav button.on.t{color:var(--teal-ink)}
  .bnav svg{width:22px;height:22px}
}

/* ---------- type & common ---------- */
.eyebrow{font-size:13.5px;color:var(--muted)}
h1{font-size:clamp(28px,3.2vw,40px);font-weight:500;letter-spacing:-.03em;line-height:1.12;margin:4px 0 6px}
.sub{color:var(--muted);font-size:14.5px;line-height:1.55}
.pghead{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:24px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:22px;margin-top:16px}
.card h3,.h3{font-size:17px;font-weight:500;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kicker{font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.goal{font-size:clamp(20px,2vw,24px);font-weight:500;letter-spacing:-.02em;line-height:1.3;margin:8px 0 10px}
.warm{background:var(--warm);border-radius:var(--r-l);padding:20px 22px;margin-top:16px;font-size:15.5px;line-height:1.6}
.warm .lbl{color:var(--warm-ink);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.warm h3{color:var(--warm-ink);font-size:17px;font-weight:500;margin-bottom:4px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:500;font-size:18px;flex:none}
.primary{width:100%;background:var(--blue);color:#fff;border-radius:var(--r-s);height:50px;padding:0 20px;font-size:15.5px;font-weight:500;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .18s var(--ease),background .2s,box-shadow .2s}
.primary svg{width:19px;height:19px}
.primary:hover:not(:disabled){background:var(--blue-dark);transform:translateY(-1px);box-shadow:0 8px 20px -10px rgb(47 91 234 / .7)}
.primary:active:not(:disabled){transform:translateY(0) scale(.985)}
.primary .arr{transition:transform .2s var(--ease)}.primary:hover .arr{transform:translateX(3px)}
.outline{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-s);height:50px;font-size:15.5px;font-weight:500;transition:transform .18s var(--ease),border-color .2s}
.outline:hover{border-color:var(--ink);transform:translateY(-1px)}.outline:active{transform:scale(.985)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.btn-row .primary{margin-top:0}
.back{font-size:14px;color:var(--blue);font-weight:500;margin-bottom:14px;display:inline-flex;gap:6px;align-items:center}
.back:hover{text-decoration:underline;text-underline-offset:3px}
.empty{text-align:center;padding:40px 24px}
.empty p{color:var(--muted);font-size:15px;margin:8px auto 0;line-height:1.55;max-width:46ch}
.fit-btn{width:auto;display:inline-flex;padding:0 22px}

/* week layout */
.wk{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0 24px;align-items:start}
.wk__main>.card:first-child,.wk__side>.card:first-child,.wk__side>.warm:first-child{margin-top:0}
@media(max-width:1023px){.wk{grid-template-columns:minmax(0,1fr)}.wk__side{order:-1}.wk__side>*:first-child{margin-top:0}.wk__main>.card:first-child{margin-top:16px}}

/* tasks */
.progress{height:8px;border-radius:99px;background:var(--blue-soft);margin:14px 0 8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s var(--ease)}
.task{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 10px;margin:0 -10px;width:calc(100% + 20px);font-size:15.5px;border-radius:var(--r-s);transition:background .2s}
.task:hover{background:var(--bg)}
.cb{width:24px;height:24px;border-radius:7px;border:1.5px solid #a9b3c4;display:grid;place-items:center;flex:none;color:#fff;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.task:active .cb{transform:scale(.9)}
.cb svg{width:14px;height:14px;opacity:0}
.task.done .cb{background:var(--blue);border-color:var(--blue)}
.task.done .cb svg{opacity:1}
.task.done .tt{text-decoration:line-through;color:var(--faint)}
.ifcheck{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--warm-line);font-size:14px;color:var(--warm-ink);flex-wrap:wrap}
.ifcheck .chips{display:flex;gap:6px}
.mini{border:1px solid var(--warm-line);background:#fff;border-radius:999px;min-height:36px;padding:0 16px;font-size:14px;font-weight:500;color:var(--warm-ink);transition:transform .18s var(--ease),background .2s}
.mini:hover{transform:translateY(-1px)}
.mini.on{background:var(--warm-ink);border-color:var(--warm-ink);color:#fff}

/* chat */
.chat-head{display:flex;flex-direction:column;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.bot-av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.bot-av svg{width:22px;height:22px}
.draftbtn{margin-left:auto;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:14px;height:40px;padding:0 14px;border-radius:var(--r-s);transition:transform .18s var(--ease),border-color .2s}
.draftbtn:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.pills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pill{position:relative;font-size:13px;font-weight:500;padding:20px 0 0;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill::before{content:"";position:absolute;left:0;right:0;top:6px;height:4px;border-radius:99px;background:var(--line);transition:background .3s}
.pill.past{color:var(--muted)}.pill.past::before{background:var(--blue-mid)}
.pill.now{color:var(--blue)}.pill.now::before{background:var(--blue)}
.msgs{flex:1;padding:24px 0 28px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:min(82%,560px);padding:12px 16px;border-radius:18px;font-size:15.5px;line-height:1.55;white-space:pre-wrap;animation:msgIn .35s var(--ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}}
.msg.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:6px}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-top-right-radius:6px}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:7px;height:7px;border-radius:50%;background:#a9b3c4;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--blue-line);background:var(--surface);color:var(--blue);border-radius:999px;min-height:40px;padding:8px 16px;font-size:14.5px;font-weight:500;text-align:left;transition:transform .18s var(--ease),background .2s}
.chip:hover{background:var(--blue-soft);transform:translateY(-1px)}
.chip:active{transform:scale(.98)}
.composer{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;padding:14px 0 20px;background:linear-gradient(transparent,var(--bg) 30%)}
.composer input{flex:1;border:1px solid var(--line);border-radius:999px;height:52px;padding:0 22px;font-size:15.5px;outline:none;background:var(--surface);box-shadow:0 10px 30px -18px rgb(18 26 46 / .4);transition:border-color .2s}
.composer input:focus{border-color:var(--blue-mid)}
.send{width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;transition:transform .18s var(--ease),background .2s}
.send:hover:not(:disabled){background:var(--blue-dark);transform:translateY(-1px)}.send:active:not(:disabled){transform:scale(.95)}
.send svg{width:21px;height:21px}
.cta-inline{align-self:flex-start;width:auto;padding:0 22px;margin-top:6px}
@media(max-width:1023px){.composer{bottom:68px;padding-bottom:12px}}

/* plan */
.woop-row{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line-2);font-size:15.5px;line-height:1.55}
.woop-row:first-child{padding-top:0}.woop-row:last-child{border-bottom:0;padding-bottom:0}
.badge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:500;font-size:14px;background:var(--blue-soft);color:var(--blue);flex:none;font-family:var(--mono)}
.badge.o2{background:var(--warm);color:var(--warm-ink)}
.badge.p{background:var(--blue);color:#fff}
.sec{font-size:17px;font-weight:500;margin:28px 0 12px}
.loads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.load{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 6px;text-align:center;transition:transform .2s var(--ease),border-color .2s}
.load:hover{transform:translateY(-2px);border-color:var(--blue-mid)}
.load b{display:block;font-size:16px;font-weight:500}
.load span{font-size:13px;color:var(--muted)}
.load.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.load.on span{color:var(--blue)}
.ptask{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;font-size:15.5px;border-bottom:1px solid var(--line-2)}
.ptask:last-child{border-bottom:0}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r-s);color:var(--muted);flex:none;transition:background .2s,color .2s}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.edit-box{display:flex;flex-direction:column;gap:8px;width:100%;padding:12px 0}
.edit-box input,.edit-box select{border:1px solid var(--line);border-radius:var(--r-s);height:44px;padding:0 12px;font-size:15px;width:100%;background:var(--surface)}
.edit-box .row button{flex:1;height:42px;border-radius:var(--r-s);font-weight:500;font-size:14px}
.save-btn{background:var(--blue);color:#fff}
.cancel-btn{background:var(--bg);color:var(--muted)}

/* reflect */
.info{background:var(--blue-soft);border-radius:var(--r-l);padding:16px 20px;display:flex;gap:14px;align-items:center;margin-top:20px;color:var(--blue);font-size:15.5px;line-height:1.5}
.info svg{width:22px;height:22px;flex:none}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
.scale button{height:56px;border:1px solid var(--line);border-radius:var(--r);font-size:19px;font-weight:500;background:var(--surface);font-family:var(--mono);transition:transform .18s var(--ease),border-color .2s,background .2s}
.scale button:hover{transform:translateY(-2px);border-color:var(--blue-mid)}
.scale button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.scale-lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
.field-lbl{font-weight:500;font-size:15px;margin:22px 0 8px}
textarea{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:15px;min-height:84px;resize:vertical;background:var(--surface);outline:none;line-height:1.55;transition:border-color .2s}
textarea:focus{border-color:var(--blue-mid)}
.feedback{font-size:16px;line-height:1.65;white-space:pre-wrap}
.rf-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.rf-grid .card{margin-top:16px}
@media(max-width:720px){.rf-grid{grid-template-columns:1fr}}

/* progress */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:8px}
.bento>*{margin-top:0!important}
.bento .wide{grid-column:1/-1}
@media(max-width:720px){.bento{grid-template-columns:minmax(0,1fr)}}
.chart{display:flex;align-items:flex-end;gap:12%;height:220px;padding:0 6px;border-bottom:1px solid var(--line);margin-top:14px}
.colw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.colw .val{font-weight:500;font-size:15px;margin-bottom:8px;font-family:var(--mono)}
.colw .bar{width:100%;max-width:120px;border-radius:10px 10px 0 0;background:var(--blue-mid);transform-origin:bottom;animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}}
.colw .bar.last{background:var(--blue)}
.colw .bar.pending{background:transparent;border:1.5px dashed var(--blue-mid);border-bottom:0;height:46px;animation:none}
.colw .val.pending{font-weight:400;color:var(--muted);font-family:var(--font)}
.xlabels{display:flex;gap:12%;padding:10px 6px 0}
.xlabels span{flex:1;text-align:center;color:var(--muted);font-size:13.5px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.mbox{border-radius:var(--r);background:var(--bg);text-align:center;padding:16px 4px}
.mbox b{display:block;font-size:26px;font-weight:500;font-family:var(--mono);letter-spacing:-.02em}
.mbox span{font-size:13px;color:var(--muted)}
.mbox.last{background:var(--blue-soft)}.mbox.last b{color:var(--blue)}
.mbox.pending{background:transparent;border:1.5px dashed #cdd3de}
ul.good{margin:12px 0 0 20px;font-size:15.5px;line-height:1.6}
ul.good li{margin-bottom:6px}

/* check-in */
.ci-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.ci-opt{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;background:var(--surface);transition:transform .2s var(--ease),border-color .2s}
.ci-opt i{width:10px;height:10px;border-radius:50%;grid-row:span 2}

/* --- GVCN --- */
const DEMO_SPECIAL={HS03:[1,4,4,[4,4,5]],HS07:[1,3,4,[3,4,4]],HS11:[0,1,4,[3,2,2]],HS14:[1,2,5,[3,3,3]],HS18:[0,0,3,[4,3,3]],HS22:[1,3,3,[2,2,3]],HS25:[0,2,4,[4,3,4]]};
function classData(){
  const rows=[];
  for(let i=1;i<=28;i++){
    const code='HS'+String(i).padStart(2,'0');
    if(code===S.student.code){
      const last=S.history[S.history.length-1];
      const moods=[4,...S.history.map(h=>h.mood)].slice(-3);
      const wc=weekCheckins();
      rows.push({code,me:true,plan:!!(S.current&&S.current.confirmed),done:last?last.done:0,total:last?last.total:0,moods,ciOk:wc.filter(x=>x.status==='ok').length,ciBad:wc.filter(x=>x.status!=='ok').length});
      continue;
    }
    const ciDemo={HS11:[1,2],HS14:[0,3],HS18:[1,1],HS22:[2,1]}[code]||[2+(i%2),i%5===0?1:0];
    if(DEMO_SPECIAL[code]){const [p,d,t,m]=DEMO_SPECIAL[code];rows.push({code,plan:!!p,done:d,total:t,moods:m,ciOk:ciDemo[0],ciBad:ciDemo[1]});continue}
    const total=4+(i%2),done=total-(i%3);
    rows.push({code,plan:true,done,total,moods:[3+(i%3),3+((i*2)%3),3+((i+1)%3)],ciOk:ciDemo[0],ciBad:ciDemo[1]});
  }
  return rows;
}
function signal(s){
  const m=s.moods,n=m.length;
  if(n>=2&&m[n-1]<=2&&m[n-2]<=2)return{k:'warn',t:'Tâm trạng thấp 2 tuần'};
  if((s.ciBad||0)>=3)return{k:'warn',t:'Chưa ổn nhiều ngày'};
  if(!s.plan&&s.done===0)return{k:'warn',t:'Bỏ kế hoạch 2 tuần'};
  if(n>=2&&m[n-1]>=3&&m[n-2]<=2)return{k:'warn',t:'Đang phục hồi'};
  if(m.every(x=>x>=3)&&s.total&&s.done/s.total>=.5)return{k:'ok',t:'Ổn định'};
  return{k:'none',t:'Không có'};
}
function teacherView(){
  const rows=classData().map(r=>({...r,sig:signal(r)}));
  const planned=rows.filter(r=>r.plan).length;
  const withTot=rows.filter(r=>r.total);
  const avg=withTot.length?Math.round(withTot.reduce((a,r)=>a+r.done/r.total,0)/withTot.length*100):0;
  const warn=rows.filter(r=>r.sig.k==='warn').length;
  const shown=S.filter?rows.filter(r=>r.sig.k==='warn'):rows;
  return `<div class="t-main">
    <div class="pghead"><div><div class="eyebrow">Giáo viên chủ nhiệm · Lớp ${CLASS_NAME} · Tuần ${S.week} · ${weekRange(S.week)}</div><h1>Bảng tín hiệu của lớp</h1></div><span class="sub">Dữ liệu minh hoạ</span></div>
    <div class="stats">
      <div class="stat"><span>Học sinh tham gia</span><b>${rows.length}</b></div>
      <div class="stat"><span>Đã lập kế hoạch tuần này</span><b>${planned}</b></div>
      <div class="stat"><span>Hoàn thành trung bình tuần trước</span><b>${avg}%</b></div>
      <div class="stat alert"><span>Cần quan tâm</span><b>${warn}</b></div>
    </div>
    <div class="t-grid">
      <div class="tcard">
        <div class="tcard-h"><div><h3>Học sinh theo mã số</h3><div class="sub">Tâm trạng: tự đánh giá 1–5 của 3 tuần gần nhất</div></div>
          <label class="toggle"><input type="checkbox" data-a="filter" ${S.filter?'checked':''}>Chỉ hiện em cần quan tâm</label></div>
        <div class="tscroll"><table><thead><tr><th>Mã HS</th><th>Kế hoạch tuần này</th><th>Hoàn thành tuần trước</th><th>Tâm trạng</th><th>Check-in tuần này</th><th>Tín hiệu</th></tr></thead><tbody>
        ${shown.map(r=>`<tr class="${r.me?'me':''}"><td class="code">${r.code}${r.me?'<span class="you">đang chạy thử</span>':''}</td><td>${r.plan?'Đã lập':'Chưa lập'}</td><td>${r.total?`${r.done}/${r.total}`:'–'}</td><td>${r.moods.join(' · ')}</td><td>${r.ciOk+r.ciBad?`${r.ciOk} ổn${r.ciBad?` · <b style="color:var(--warm-ink)">${r.ciBad} chưa ổn</b>`:''}`:'–'}</td><td><span class="tag ${r.sig.k}">${r.sig.t}</span></td></tr>`).join('')}
        </tbody></table></div>
      </div>
      <aside>
        <div class="side-card"><h3>Gợi ý khi có tín hiệu</h3><ol>
          <li>Trò chuyện riêng 5–10 phút, hỏi em đang cần gì.</li>
          <li>Gợi ý em chọn khối lượng nhẹ hơn cho tuần sau.</li>
          <li>Căng thẳng kéo dài: giới thiệu phòng tư vấn tâm lý học đường.</li>
          <li>Check-in chưa ổn nhiều ngày: hỏi thăm sức khoẻ, phối hợp phòng y tế nếu cần.</li></ol>
          <div class="legend"><b>Cách tính tín hiệu</b><br>• Tâm trạng thấp 2 tuần: 2 tuần gần nhất ≤ 2/5<br>• Chưa ổn nhiều ngày: từ 3 lần check-in mệt / không khoẻ / căng thẳng trong tuần<br>• Bỏ kế hoạch 2 tuần: chưa lập tuần này và tuần trước hoàn thành 0<br>• Đang phục hồi: vừa tăng từ mức ≤ 2 lên ≥ 3<br>• Ổn định: tâm trạng ≥ 3 và hoàn thành ≥ 50%</div>
        </div>
        <div class="privacy">${IC.lock}<div>GVCN chỉ thấy các tín hiệu tổng quát ở đây, không xem nội dung trò chuyện giữa học sinh và Banipu, cũng không xem ghi chú check-in của em.</div></div>
      </aside>
    </div>
  </div>`;
}

/* ---------------- Chat logic ---------------- */
function startChat(){
  const name=S.student.name;
  S.chat=[{r:'bot',t:S.current&&S.current.confirmed
    ?`Chào ${name}! Em đã có kế hoạch tuần ${S.week} rồi. Nếu muốn điều chỉnh, mình bắt đầu lại nhé: tuần này em muốn đạt được điều gì trong việc học?`
    :`Chào ${name}! Tuần này em muốn đạt được điều gì trong việc học?`}];
  S.stage=0;S.col={};S.draft=null;S.planView=false;
  S.chips=['Ôn chắc một chương','Làm thêm đề luyện','Cải thiện môn còn yếu'];
}

function parseIfThen(text,obstacle){
  const t=trimDot(text);
  const m=t.match(/n[eế]u\s+(.+?)\s*,?\s*th[iì]\s+(.+)/i);
  if(m){let th=m[2].trim();if(!/^em\b/i.test(th))th='em '+low(th);return{ifPart:low(m[1].trim()),thenPart:th}}
  let th=low(t);if(!/^em\b/i.test(th))th='em '+th;
  return{ifPart:'gặp trở ngại: '+low(obstacle||'mất tập trung'),thenPart:th};
}

function scriptedTurn(text){
  const st=S.stage,v=trimDot(text);
  if(v.length<3)return{reply:'Em nói rõ hơn một chút được không? Banipu muốn hiểu đúng ý em.',advance:false,chips:[]};
  if(st===0)return{advance:true,value:cap(v.replace(/^(em|tớ|mình)\s+(muốn|sẽ|định|cần)\s+/i,'')),reply:(v.split(/\s+/).length>=5?'Mục tiêu rất cụ thể! ':'Mục tiêu hay đấy! ')+'Khi làm được điều đó, em sẽ cảm thấy thế nào?',chips:['Tự tin hơn khi kiểm tra','Nhẹ nhõm, bớt lo','Hiểu bài chắc hơn']};
  if(st===1)return{advance:true,value:cap(v),reply:'Nghe thật đáng mong chờ. Vậy điều gì **bên trong em** có thể cản trở kế hoạch này?',chips:['Em hay lướt điện thoại','Buổi tối em dễ mệt','Em không biết bắt đầu từ đâu']};
  if(st===2){
    const lv=v.toLowerCase();let chips;
    if(/điện thoại|lướt|mạng|game|tiktok/.test(lv))chips=['Nếu muốn cầm điện thoại khi tự học, thì để nó ngoài phòng 30 phút','Nếu thấy thèm lướt, thì em làm xong 1 câu rồi mới nghỉ'];
    else if(/mệt|buồn ngủ|uể oải/.test(lv))chips=['Nếu buổi tối thấy mệt, thì em làm nhiệm vụ nhẹ nhất trong 15 phút','Nếu thấy buồn ngủ, thì em đứng dậy rửa mặt rồi học tiếp'];
    else if(/bắt đầu|không biết|ngại|lười|trì hoãn/.test(lv))chips=['Nếu không biết bắt đầu từ đâu, thì em làm câu dễ nhất trong 10 phút','Nếu thấy ngại, thì em chỉ mở sách và làm 1 câu'];
    else chips=['Nếu trở ngại đó xuất hiện, thì em hít thở và làm tiếp 10 phút'];
    return{advance:true,value:cap(v),reply:'Banipu hiểu rồi. Khi trở ngại đó xuất hiện, em sẽ làm gì? Thử nói theo dạng **Nếu… thì…** nhé.',chips};
  }
  if(st===3){const p=parseIfThen(v,S.col.obstacle);return{advance:true,value:v,if_part:p.ifPart,then_part:p.thenPart,reply:'Tuyệt! Kế hoạch rất rõ ràng. Banipu đã soạn **kế hoạch nháp** — em xem và chỉnh lại theo ý mình nhé, em là người quyết định.',chips:[]}}
  return{reply:'',advance:false,chips:[]};
}

async function aiTurn(){
  const transcript=S.chat.slice(-14).map(m=>(m.r==='bot'?'Banipu: ':'Học sinh: ')+m.t).join('\n');
  const prompt=`Bạn là Banipu – trợ lý lập kế hoạch học tập cho học sinh THPT Việt Nam, dựa trên Thuyết Tự quyết (tự chủ, năng lực, gắn kết) và phương pháp WOOP (Mong muốn – Kết quả – Trở ngại – Kế hoạch Nếu–thì).
Nguyên tắc:
- Gọi học sinh là "em". Thân thiện, ấm áp, ngắn gọn (1–3 câu), mỗi lượt chỉ hỏi MỘT câu.
- Không ra lệnh, không phán xét, không so sánh với bạn khác. Tôn trọng lựa chọn của em; chỉ gợi ý khi em bí.
- Mục tiêu nên cụ thể, làm được trong 1 tuần; nếu quá mơ hồ hoặc quá lớn, hỏi để em tự thu hẹp.
- Trở ngại phải là điều BÊN TRONG em (thói quen, cảm xúc, suy nghĩ). Nếu em nêu yếu tố bên ngoài, nhẹ nhàng hỏi điều gì trong em khiến việc đó cản trở.
- Kế hoạch ở dạng "Nếu [tình huống/trở ngại], thì em [hành động cụ thể, nhỏ, làm ngay được]".
- Nếu em bày tỏ căng thẳng nặng, buồn bã kéo dài hoặc ý nghĩ làm hại bản thân: tạm dừng việc lập kế hoạch, đáp lại ân cần và khuyến khích em nói ngay với thầy cô chủ nhiệm, phòng tư vấn tâm lý học đường hoặc người lớn em tin tưởng (advance=false).
- Nếu em hỏi chuyện ngoài việc lập kế hoạch học tập tuần, nhẹ nhàng đưa về chủ đề.

Các giai đoạn: 0 Mong muốn (em muốn đạt gì tuần này), 1 Kết quả (khi đạt được em sẽ cảm thấy/được gì), 2 Trở ngại (điều bên trong em), 3 Kế hoạch Nếu–thì.
Giai đoạn hiện tại: ${S.stage} (${STAGES[S.stage]}).
Đã chốt: ${JSON.stringify(S.col)}

Hội thoại gần đây:
${transcript}

Xét câu trả lời mới nhất của học sinh cho giai đoạn hiện tại.
- Nếu đủ rõ: advance=true; value = nội dung cô đọng (câu ngắn, viết hoa chữ đầu, không dấu chấm cuối); reply = ghi nhận ngắn + câu hỏi của giai đoạn kế tiếp. Ở giai đoạn 3: reply = lời khen ngắn và báo Banipu đã soạn kế hoạch nháp để em xem, chỉnh và tự quyết định; điền if_part (không có chữ "Nếu", viết thường chữ đầu) và then_part (không có chữ "thì", bắt đầu bằng "em ...").
- Nếu chưa rõ: advance=false; reply = một câu hỏi gợi mở để em tự làm rõ.
- chips: 2–3 gợi ý trả lời ngắn (dưới 12 từ) cho câu hỏi trong reply, giọng học sinh; ở giai đoạn 2→3 chips là các câu Nếu–thì mẫu; mảng rỗng nếu không phù hợp hoặc khi đã xong.
Có thể dùng **in đậm** cho 1–2 chữ quan trọng.
Chỉ trả về JSON: {"reply":string,"advance":boolean,"value":string,"chips":string[],"if_part":string,"then_part":string}`;
  return await sample.json(prompt,{cache:false,modelTier:'quick'});
}

async function send(text){
  text=String(text||'').trim();
  if(!text||busy||S.stage>=4)return;
  S.chat.push({r:'me',t:text});S.chips=[];chatDraft='';busy=true;render();
  let res=null;
  if(sample){try{res=await aiTurn();if(!res||typeof res.reply!=='string')res=null}catch(e){res=null;if(e&&e.code==='not_granted')sample=null}}
  if(!res)res=scriptedTurn(text);
  if(res.advance){
    const f=FIELDS[S.stage];
    if(S.stage===3){
      let ip=trimDot(res.if_part||''),tp=trimDot(res.then_part||'');
      if(!ip||!tp){const p=parseIfThen(text,S.col.obstacle);ip=ip||p.ifPart;tp=tp||p.thenPart}
      if(!/^em\b/i.test(tp))tp='em '+low(tp);
      S.col.ifPart=low(ip.replace(/^n[eế]u\s+/i,''));S.col.thenPart=tp.replace(/^th[iì]\s+/i,'');
    }else S.col[f]=cap(trimDot(res.value||text));
    S.stage++;
  }
  S.chat.push({r:'bot',t:res.reply||'Em kể thêm cho Banipu nhé?'});
  S.chips=Array.isArray(res.chips)?res.chips.slice(0,3):[];
  if(S.stage>=4){S.chips=[];await makeDraft()}
  busy=false;render();
  const ci=document.getElementById('chatIn');if(ci&&S.stage<4)ci.focus();
}

/* ---------------- Draft plan ---------------- */
const PRIORITY_DAYS=[1,3,4,5,6];
function ruleTasks(wish){
  const m=wish.match(/(\d+)\s+(.+)/);
  if(m){
    const n=Math.max(1,Math.min(parseInt(m[1],10),4));
    const words=m[2].trim().split(/\s+/);
    const unit=cap(words.slice(0,words[1]&&!/^(chương|môn|phần|về|của|cho|bài)$/i.test(words[1])?2:1).join(' '));
    const items=[];for(let i=1;i<=n;i++)items.push(`${unit} số ${i}`);
    const review=n>=2?`Xem lại lỗi sai ${low(unit)} 1 và 2`:'Xem lại lỗi sai và ghi chú';
    const list=[items[0]];if(items[1])list.push(items[1]);list.push(review);items.slice(2).forEach(x=>list.push(x));
    ['Tự kiểm tra nhanh 15 phút','Ôn lại phần còn yếu','Tóm tắt kiến thức ra 1 trang'].forEach(x=>list.push(x));
    return list.slice(0,5);
  }
  const short=wish.length>40?wish.slice(0,40).trim()+'…':wish;
  return['Bắt đầu: '+low(short),'Làm tiếp phần chính','Xem lại lỗi sai và ghi chú','Tự kiểm tra nhanh 15 phút','Ôn lại phần còn yếu'];
}
async function makeDraft(){
  const W={wish:S.col.wish,outcome:S.col.outcome,obstacle:S.col.obstacle,ifPart:S.col.ifPart,thenPart:S.col.thenPart};
  let tasks=null;
  if(sample){
    try{
      const r=await sample.json(`Soạn 5 nhiệm vụ học tập cho MỘT tuần để một học sinh THPT Việt Nam đạt mục tiêu sau, xếp theo mức ưu tiên (quan trọng nhất trước).
Mục tiêu: ${W.wish}
Kết quả mong muốn: ${W.outcome}
Trở ngại bên trong: ${W.obstacle}
Kế hoạch Nếu–thì: Nếu ${W.ifPart}, thì ${W.thenPart}
Yêu cầu:
- Mỗi nhiệm vụ cụ thể, làm được trong một buổi tự học (30–90 phút), tên ngắn dưới 10 từ, không đánh số thứ tự ở đầu, không có dấu chấm cuối.
- Nếu mục tiêu có số lượng (vd "3 đề"), 4 nhiệm vụ đầu phải bao trọn mục tiêu đó (gồm một nhiệm vụ xem lại lỗi sai); nhiệm vụ thứ 5 là phần mở rộng tuỳ chọn. 2 nhiệm vụ đầu là phần cốt lõi nhất.
- day: 0=thứ Hai, 1=thứ Ba, 2=thứ Tư, 3=thứ Năm, 4=thứ Sáu, 5=thứ Bảy, 6=Chủ nhật; rải đều, tránh trùng ngày.
Chỉ trả về JSON: {"tasks":[{"title":string,"day":number}]}`,{cache:false,modelTier:'quick'});
      if(r&&Array.isArray(r.tasks)&&r.tasks.length>=2)tasks=r.tasks.slice(0,5).map((t,i)=>({id:nid(),title:trimDot(t.title||'Nhiệm vụ '+(i+1)),day:Number.isInteger(t.day)&&t.day>=0&&t.day<=6?t.day:PRIORITY_DAYS[i]}));
    }catch(e){}
  }
  if(!tasks)tasks=ruleTasks(W.wish||'').map((t,i)=>({id:nid(),title:t,day:PRIORITY_DAYS[i]}));
  S.draft={woop:W,load:'vua',pool:tasks};
}

/* ---------------- Reflection feedback ---------------- */
function templateFeedback(e){
  const pct=e.total?e.done/e.total:0,out=[];
  if(!e.total)out.push('Tuần này em chưa lập kế hoạch, và việc em vẫn dừng lại nhìn lại đã là một bước quan trọng.');
  else if(pct>=.75)out.push(`Em đã giữ nhịp rất tốt: hoàn thành ${e.done}/${e.total} nhiệm vụ em tự chọn.`);
  else if(pct>=.4)out.push(`Em đã hoàn thành ${e.done}/${e.total} nhiệm vụ — đó là tiến bộ thật sự, vì đây là kế hoạch do chính em đặt ra.`);
  else out.push('Tuần này khó hơn dự kiến, và việc em dừng lại để nhìn lại cho thấy em đang nghiêm túc với mục tiêu của mình.');
  if(e.good)out.push(`Điều em làm tốt — “${trimDot(e.good.split('\n')[0])}” — là một kỹ năng em có thể mang sang tuần sau.`);
  if(e.hard)out.push(`Với khó khăn “${trimDot(e.hard)}”, tuần tới em thử nghĩ trước một kế hoạch **Nếu – thì** riêng cho tình huống đó nhé.`);
  if(e.total&&pct<.5)out.push('Nếu thấy phù hợp, em có thể chọn khối lượng **Nhẹ** hơn cho tuần sau — em vẫn là người quyết định.');
  if(e.mood<=2)out.push('Banipu thấy em đang thấy việc học khá nặng nề. Em không phải tự gánh một mình đâu: em có thể chia sẻ với thầy cô chủ nhiệm hoặc phòng tư vấn tâm lý học đường bất cứ lúc nào.');
  return out.join('\n\n');
}
async function getFeedback(e){
  if(sample){
    try{
      const r=await sample(`Bạn là Banipu – trợ lý học tập dựa trên Thuyết Tự quyết. Viết phản hồi ngắn (3–5 câu, tiếng Việt, gọi học sinh là "em") cho bài tự đánh giá cuối tuần dưới đây.
Yêu cầu: ghi nhận nỗ lực cụ thể (năng lực), không chấm điểm, không so sánh với bạn khác, không ra lệnh — chỉ gợi ý và nhấn mạnh em là người quyết định (tự chủ); giọng ấm áp (gắn kết). Gợi ý 1 điều nhỏ cho tuần sau dựa trên khó khăn em nêu. Nếu tỉ lệ hoàn thành dưới 50% có thể gợi ý chọn khối lượng nhẹ hơn. Nếu tâm trạng ≤ 2, thêm một câu nhẹ nhàng khuyến khích em chia sẻ với thầy cô chủ nhiệm hoặc phòng tư vấn tâm lý học đường. Không dùng tiêu đề hay gạch đầu dòng; có thể **in đậm** 1–2 cụm từ.
Dữ liệu: mục tiêu "${S.current&&S.current.woop?S.current.woop.wish:'(chưa lập)'}"; hoàn thành ${e.done}/${e.total}; tự đánh giá ${e.selfRate}/5; tâm trạng ${e.mood}/5; điều làm tốt: "${e.good||'(trống)'}"; khó khăn: "${e.hard||'(trống)'}".`,{cache:false,modelTier:'quick'});
      if(r&&r.text&&r.text.trim())return r.text.trim();
    }catch(err){}
  }
  return templateFeedback(e);
}

/* ---------------- Check-in & điều chỉnh lịch ---------------- */

function active(){return S.current&&S.current.confirmed?S.current.tasks.filter(t=>!t.postponed):[]}

    return `<div class="card ci"><div class="between"><div class="row"><span class="bot-av sm">${IC.compass}</span><b>Banipu</b></div><span class="row" style="gap:6px;font-size:13px;color:var(--muted)"><i class="dot" style="background:${st.c}"></i>${st.l}</span></div>
      <div class="ci-msg">${fmt(c.message)}</div>
      ${opts.length?`<div class="ci-label">Em muốn điều chỉnh thế nào?</div>${opts.map((o,i)=>`<button class="adj-opt ${c.sel===i?'on':''}" data-a="adjsel" data-v="${i}"><b>${esc(o.label)}</b><span>${esc(o.desc||'')}</span>${c.sel===i?`<ul>${o.ops.map(opText).join('')}</ul>`:''}</button>`).join('')}`:''}
      <div class="btn-row"><button class="outline" data-a="adjkeep">Giữ nguyên lịch</button><button class="primary" data-a="adjapply" ${c.sel==null?'disabled':''}>Áp dụng lịch mới</button></div></div>`;
  }
  // done
  const sub=c.status==='ok'?'Chúc em một ngày học hiệu quả!':c.applied?`Đã điều chỉnh: ${esc(c.applied.label)}`:'Em giữ nguyên lịch — nhớ nghỉ khi cần nhé.';
  return `<div class="card ci"><div class="between"><div class="row"><i class="dot" style="background:${st.c}"></i><div><b>Check-in hôm nay: ${st.l}</b><div class="sub">${sub}</div></div></div>
    <div class="row" style="gap:12px">${c.applied?'<button class="linkbtn" data-a="adjundo">Hoàn tác</button>':''}<button class="linkbtn" data-a="ciredo">Đổi</button></div></div>
    ${c.status!=='ok'&&c.message?`<div class="ci-tip">${fmt(c.message.split('\n\n')[0])}</div>`:''}</div>`;
}
function opText(op){
  const t=taskById(op.id);if(!t)return'';
  if(op.type==='move')return `<li>${esc(t.title)}: ${DAYS[t.day]} → <b>${DAYS[op.day]}</b></li>`;
  if(op.type==='lite')return `<li>${esc(t.title)}: làm <b>bản nhẹ</b> khoảng 20 phút</li>`;
  if(op.type==='postpone')return `<li>${esc(t.title)}: <b>tạm hoãn</b> sang tuần sau</li>`;
  return '';
}

function affectedTasks(){
  const und=active().filter(t=>!t.done);
  let a=und.filter(t=>t.day===TI||t.day===TI+1);
  if(!a.length){const up=und.filter(t=>t.day>TI).sort((x,y)=>x.day-y.day);if(up.length)a=[up[0]]}
  return a;
}
function moveOps(list){
  const cnt=Array(7).fill(0);active().forEach(t=>cnt[t.day]++);
  return list.map(t=>{
    let best=null;for(let d=Math.max(TI,t.day)+1;d<7;d++){if(best===null||cnt[d]<cnt[best])best=d}
    if(best===null)return{type:'postpone',id:t.id};
    cnt[best]++;cnt[t.day]--;return{type:'move',id:t.id,day:best};
  });
}
function ruleMessage(c,hasTasks){
  const out=[];
  if(c.status==='sick')out.push('Cảm ơn em đã cho Banipu biết. **Sức khoẻ của em quan trọng hơn kế hoạch** — hôm nay em ưu tiên nghỉ ngơi, uống đủ nước nhé. Nếu em sốt, đau nhiều hoặc mệt kéo dài, hãy báo thầy cô chủ nhiệm hoặc xuống phòng y tế trường.');
  else if(c.status==='tired')out.push('Cảm ơn em đã chia sẻ. Khi mệt, **làm ít mà đều** vẫn tốt hơn cố quá sức.');
  else out.push('Căng thẳng là cảm giác rất bình thường trước nhiều việc. Mình thử **chia nhỏ** việc học để nhẹ đầu hơn nhé. Nếu cảm giác này kéo dài, em có thể nói chuyện với thầy cô chủ nhiệm hoặc phòng tư vấn tâm lý học đường.');
  if(c.sleep==='lt5')out.push('Đêm qua em ngủ khá ít — tối nay thử đi ngủ sớm hơn 30 phút nhé.');
  out.push(hasTasks?'Banipu gợi ý vài cách điều chỉnh, em chọn cách hợp với mình:':'Hôm nay và ngày mai em không còn nhiệm vụ nào phải làm — cứ nghỉ ngơi thật tốt nhé.');
  return out.join('\n\n');
}
function ruleOptions(c){
  const a=affectedTasks(),opts=[];
  const lite={label:'Làm bản nhẹ',desc:'Giữ ngày cũ nhưng chỉ làm khoảng 20 phút, dừng khi thấy mệt',ops:a.map(t=>({type:'lite',id:t.id}))};
  const move={label:c.status==='sick'?'Nghỉ ngơi, dời nhiệm vụ':'Dời sang ngày khác',desc:'Chuyển sang ngày còn ít việc hơn trong tuần',ops:moveOps(a)};
  const moveOne={label:'Dời bớt một nhiệm vụ',desc:'Giảm tải hôm nay, phần còn lại làm nhẹ',ops:a.length>1?[...moveOps([a[0]]),...a.slice(1).map(t=>({type:'lite',id:t.id}))]:moveOps(a)};
  if(c.status==='sick')opts.push(move,{...lite,label:'Làm bản rất nhẹ',desc:'Chỉ 15–20 phút nếu em thấy đủ sức'});
  else if(c.status==='tired')opts.push(lite,move);
  else opts.push({...lite,label:'Chia nhỏ, làm bản nhẹ',desc:'Mỗi lần 20 phút, nghỉ 5 phút giữa các lần'},moveOne);
  const badDays=badOtherDays()+1;
  const und=active().filter(t=>!t.done).sort((x,y)=>x.day-y.day);
  if(badDays>=2&&und.length>=2)opts.push({label:'Giảm khối lượng tuần này',desc:`Tuần này em đã có ${badDays} ngày chưa ổn — tạm hoãn 1 nhiệm vụ sang tuần sau`,ops:[{type:'postpone',id:und[und.length-1].id}]});
  return opts.filter(o=>o.ops.length);
}
function validOps(ops){
  const und=new Set(active().filter(t=>!t.done).map(t=>t.id));
  return (Array.isArray(ops)?ops:[]).filter(o=>o&&und.has(Number(o.id))&&(o.type==='lite'||o.type==='postpone'||(o.type==='move'&&Number.isInteger(o.day)&&o.day>=TI&&o.day<=6)))
    .map(o=>({type:o.type,id:Number(o.id),day:o.day}));
}
async function buildAdjust(c){
  const hasTasks=affectedTasks().length>0||active().some(t=>!t.done);
  let message=null,options=null;
  if(sample&&hasTasks){
    try{
      const list=active().filter(t=>!t.done).map(t=>`- id ${t.id}: "${t.title}" (${DAYS[t.day]}, day=${t.day})${t.lite?' [đã là bản nhẹ]':''}`).join('\n');
      const r=await sample.json(`Bạn là Banipu – trợ lý học tập cho học sinh THPT nội trú, dựa trên Thuyết Tự quyết. Học sinh vừa check-in hôm nay (${DAYS[TI]}, day=${TI}; 0=thứ Hai … 6=Chủ nhật).
Trạng thái: ${CI[c.status].l}. Giấc ngủ đêm qua: ${SLEEP[c.sleep]||'không nói'}. Em kể thêm: "${c.note||'(không)'}".
Số ngày chưa ổn tuần này (kể cả hôm nay): ${badOtherDays()+1}.
Nhiệm vụ chưa xong trong tuần:
${list}

Viết "message": 2–4 câu ấm áp, gọi học sinh là "em", ghi nhận cảm xúc, KHÔNG chẩn đoán hay khuyên dùng thuốc. Nếu không khoẻ: nhắc nghỉ ngơi và báo thầy cô chủ nhiệm hoặc xuống phòng y tế trường nếu sốt, đau nhiều, mệt kéo dài. Nếu căng thẳng: gợi ý chia nhỏ việc và nhắc có thể nói chuyện với GVCN hoặc phòng tư vấn tâm lý học đường nếu kéo dài. Kết thúc bằng câu mời em chọn cách điều chỉnh.
Đề xuất 2–3 "options" khác nhau để điều chỉnh lịch phù hợp với sức khoẻ, ưu tiên các nhiệm vụ hôm nay và ngày mai. Mỗi option có label (dưới 6 từ), desc (dưới 16 từ), ops gồm các thao tác:
{"type":"move","id":số,"day":số ≥ ${TI}} chuyển ngày; {"type":"lite","id":số} làm bản nhẹ ~20 phút; {"type":"postpone","id":số} tạm hoãn sang tuần sau.
Không dời nhiệm vụ vào hôm nay khi em không khoẻ; tránh dồn nhiều việc vào một ngày.
Chỉ trả về JSON: {"message":string,"options":[{"label":string,"desc":string,"ops":[...]}]}`,{cache:false,modelTier:'quick'});
      if(r&&typeof r.message==='string'&&r.message.trim())message=r.message.trim();
      if(r&&Array.isArray(r.options))options=r.options.slice(0,3).map(o=>({label:String(o.label||'Điều chỉnh'),desc:String(o.desc||''),ops:validOps(o.ops)})).filter(o=>o.ops.length);
    }catch(e){}
  }
  if(!options||!options.length)options=ruleOptions(c);
  if(!message)message=ruleMessage(c,options.length>0);
  if(c.status==='sick'&&!/y tế/i.test(message))message+='\n\nNếu em sốt, đau nhiều hoặc mệt kéo dài, hãy báo thầy cô chủ nhiệm hoặc xuống phòng y tế trường nhé.';
  return{message,options};
}
function applyOps(ops){
  ops.forEach(o=>{const t=taskById(o.id);if(!t)return;
    if(o.type==='move'){if(t.movedFrom==null)t.movedFrom=t.day;t.day=o.day}
    else if(o.type==='lite')t.lite=true;
    else if(o.type==='postpone')t.postponed=true;});
}

/* ---------------- Events ---------------- */
const A={
  ci(el){const v=el.dataset.v;S.checkins[ciKey()]=v==='ok'?{status:'ok',phase:'done'}:{status:v,phase:'form',sleep:'',note:''};render()},
  cisleep(el){const c=S.checkins[ciKey()];if(c){c.sleep=c.sleep===el.dataset.v?'':el.dataset.v;render()}},
  async ciadjust(){
    const c=S.checkins[ciKey()];if(!c)return;
    if(!S.current||!S.current.confirmed){c.message=ruleMessage(c,false)+'\n\nKhi đã khoẻ hơn, em có thể trò chuyện với Banipu để lập kế hoạch nhẹ nhàng cho tuần này.';c.phase='done';render();return}
    c.phase='loading';render();
    const r=await buildAdjust(c);c.message=r.message;c.options=r.options;c.sel=r.options.length?0:null;c.phase=r.options.length?'adjust':'done';render();
  },
  adjsel(el){const c=S.checkins[ciKey()];c.sel=Number(el.dataset.v);render()},
  adjkeep(){const c=S.checkins[ciKey()];c.phase='done';c.applied=null;render()},
  adjapply(){const c=S.checkins[ciKey()];const o=c.options[c.sel];if(!o)return;
    c.applied={label:o.label,before:JSON.stringify(S.current.tasks)};applyOps(o.ops);c.phase='done';render()},
  adjundo(){const c=S.checkins[ciKey()];if(c&&c.applied){S.current.tasks=JSON.parse(c.applied.before);c.applied=null;c.phase=c.options&&c.options.length?'adjust':'done';render()}},
  ciredo(){const c=S.checkins[ciKey()];if(c&&c.applied)S.current.tasks=JSON.parse(c.applied.before);delete S.checkins[ciKey()];render()},
  role(el){S.role=el.dataset.v;window.scrollTo(0,0);render()},
  reset(){if(!resetArmed){resetArmed=true;render();setTimeout(()=>{resetArmed=false;render()},3000);return}
    resetArmed=false;S=defaultState();chatDraft='';busy=false;render()},
  tab(el){S.role='student';S.tab=el.dataset.v;window.scrollTo(0,0);S.editId=null;if(S.tab==='banipu'&&!S.chat.length)startChat();render();if(S.tab==='banipu')document.getElementById('chatIn')?.focus()},
  gochat(){S.tab='banipu';S.planView=false;if(!S.chat.length||S.stage>=4&&S.current&&S.current.confirmed&&!S.draft)startChat();render()},
  toggle(el){const t=S.current.tasks.find(x=>x.id==el.dataset.id);if(t){t.done=!t.done;render()}},
  iflog(el){const k=todayKey(),v=el.dataset.v==='1';if(S.ifLog[k]===v)delete S.ifLog[k];else S.ifLog[k]=v;render()},
  chip(el){send(el.dataset.v)},
  openplan(){if(S.draft){S.planView=true;S.editId=null;render()}},
  closeplan(){S.planView=false;S.editId=null;render()},
  load(el){S.draft.load=el.dataset.v;S.editId=null;render()},
  edit(el){S.editId=Number(el.dataset.id);render();const i=document.getElementById('ed-title');if(i){i.focus();i.select()}},
  editcancel(){S.editId=null;render()},
  editsave(el){const t=S.draft.pool.find(x=>x.id==el.dataset.id);const ti=document.getElementById('ed-title').value.trim();
    if(t){if(ti)t.title=ti;t.day=Number(document.getElementById('ed-day').value)}S.editId=null;render()},
  restart(){startChat();S.tab='banipu';render()},
  confirm(){
    const d=S.draft,n=LOADS[d.load].n,prev=S.current&&S.current.tasks||[];
    const tasks=d.pool.slice(0,n).map(t=>({id:t.id,title:t.title,day:t.day,done:!!prev.find(p=>p.title===t.title&&p.done)}));
    S.current={confirmed:true,load:d.load,woop:{...d.woop},tasks};
    S.draft=null;S.planView=false;S.chat=[];S.stage=0;S.tab='week';render();
  },
  rate(el){S.rdraft[el.dataset.k]=Number(el.dataset.v);render()},
  async submitreflect(){
    const r=S.rdraft;if(!r.selfRate||!r.mood)return;
    const done=active().filter(t=>t.done).length,total=active().length,wc=weekCheckins();
    const entry={week:S.week,done,total,selfRate:r.selfRate,mood:r.mood,good:r.good.trim(),hard:r.hard.trim(),ci:{ok:wc.filter(x=>x.status==='ok').length,bad:wc.filter(x=>x.status!=='ok').length}};
    S.reflected={entry,feedback:null};render();
    const fb=await getFeedback(entry);S.reflected.feedback=fb;render();
  },
  nextweek(){
    if(!S.reflected)return;
    S.history.push(S.reflected.entry);
    const st=ifStats();S.ifPrev=st;S.ifLog={};
    S.week++;S.current={confirmed:false,load:'vua',woop:S.current&&S.current.woop?S.current.woop:null,tasks:[]};
    S.reflected=null;S.rdraft={selfRate:0,mood:0,good:'',hard:''};
    S.chat=[];startChat();S.tab='banipu';render();
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  if(el.tagName==='INPUT'&&el.type==='checkbox')return;
  A[el.dataset.a]&&A[el.dataset.a](el);
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.a==='filter'){S.filter=e.target.checked;render()}});
document.addEventListener('input',e=>{
  const m=e.target.dataset&&e.target.dataset.m;
  if(m){S.rdraft[m]=e.target.value;save()}
  if(e.target.dataset&&e.target.dataset.ci==='note'){const c=S.checkins[ciKey()];if(c){c.note=e.target.value;save()}}
  if(e.target.id==='chatIn')chatDraft=e.target.value;
});
document.addEventListener('submit',e=>{if(e.target.id==='composer'){e.preventDefault();send(document.getElementById('chatIn').value)}});
document.addEventListener('keydown',e=>{if(e.target.id==='ed-title'&&e.key==='Enter'){e.preventDefault();document.querySelector('[data-a="editsave"]')?.click()}});

render();
</script>
